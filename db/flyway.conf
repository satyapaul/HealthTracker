# Flyway configuration — PostOpCare
#
# Credentials/URL are supplied via environment variables and MUST NOT be
# hardcoded or committed. Flyway expands ${ENV_VAR} placeholders from the
# process environment.
#
# In real environments the URL points at the RDS Proxy endpoint fronting
# Aurora PostgreSQL 16 in ap-south-1 (see HLD §4.5). For local development,
# point it at a throwaway PostgreSQL 16 instance.
#
# Required env vars:
#   FLYWAY_URL       e.g. jdbc:postgresql://<rds-proxy-endpoint>:5432/postopcare
#   FLYWAY_USER      DB user (from Secrets Manager in real envs)
#   FLYWAY_PASSWORD  DB password (from Secrets Manager in real envs)

flyway.url=${FLYWAY_URL}
flyway.user=${FLYWAY_USER}
flyway.password=${FLYWAY_PASSWORD}

# Versioned + repeatable migrations live here.
flyway.locations=filesystem:sql

# Safety: never auto-clean a non-empty schema in shared/real environments.
# `npm run clean` is intended for throwaway/local DBs only; keep disabled by default.
flyway.cleanDisabled=true

# Create the schema history table if the schema is empty (first run).
flyway.baselineOnMigrate=false

# Fail fast on out-of-order or missing migrations.
flyway.validateOnMigrate=true

# Placeholder available to migrations as ${app_db_role}; the least-privilege
# application role that RLS policies are written against (see conventions.md).
flyway.placeholders.app_db_role=postopcare_app
