name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, Test, Build, Synth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Build all workspaces (apps + infra). Infra build was made clean in WP 0.3.
      - name: Build
        run: npm run build

      # Infra synth is a required gate as of WP 0.3 (the DataOps split resolved
      # the last cross-stack dependency cycle; `cdk synth` is clean).
      - name: Infra synth
        run: npm run synth
